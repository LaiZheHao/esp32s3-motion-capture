name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install host dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -B -X utf8 -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/pose_math.js
          node --check web/body_view.js
          node --check web/body_app.js
          node --check web/direction_app.js
          node --check web/navigation.js
          node --check web/session_archive.js
          node --check web/mannequin.js
      - name: Test pose transformations
        run: |
          node tests/test_pose_math.js
          node tests/test_display_buffer.js
          node tests/test_render_visibility.js
      - name: Test body scene and device selection
        run: |
          node tests/test_body_view.js
          node tests/test_scene_coordinates.js
          node tests/test_body_selection.js
          node tests/test_direction_ui.js
          node tests/test_navigation.js
          node tests/test_session_archive.js
          node tests/test_mannequin.js
          node tests/test_body_layers.js
      - name: Generate offline experiment reports
        run: |
          for preset in rigid_check upper_limb lower_limb bilateral; do
            python -B -X utf8 run_motion_presets.py --preset "$preset" --demo --output "preset_runs/demo_$preset"
          done
      - name: Test experiment report JavaScript
        run: node tests/test_preset_report.js
      - name: Test bounded firmware output queue
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror ../firmware/tests/test_frame_tx_queue.cpp -o "$RUNNER_TEMP/test_frame_tx_queue"
          "$RUNNER_TEMP/test_frame_tx_queue"

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [esp32-s3-devkitm-1, esp32-s3-client-b]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.19
      - name: Create build-only Wi-Fi configuration
        run: cp include/wifi_config.example.h include/wifi_config.h
      - name: Build node firmware
        run: pio run --environment "${{ matrix.environment }}"
