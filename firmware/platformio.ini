; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_flags = -Wall -Wextra -Werror
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    finani/ICM42688

; Node B joins node A's existing AP; private router credentials stay untouched.
[env:esp32-s3-client-b]
extends = env:esp32-s3-devkitm-1
build_flags =
    ${env:esp32-s3-devkitm-1.build_flags}
    -DIMU_JOIN_NODE_AP=1
    -DIMU_CLIENT_IP_LAST_OCTET=201

[env:esp32-s3-motion-usb]
extends = env:esp32-s3-devkitm-1
build_flags =
    ${env:esp32-s3-devkitm-1.build_flags}
    -DIMU_ONBOARD_MOTION=1
