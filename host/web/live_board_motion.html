<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单板实时位移与加速度</title><style>
body{font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#edf3f7;color:#17354a;max-width:1100px;margin:30px auto;padding:20px}h1{font-size:28px}.card{background:white;padding:24px;border-radius:14px;border:1px solid #d5e1e8;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.value{font-size:27px;font-variant-numeric:tabular-nums}.muted{color:#637989;font-size:14px}button{font:inherit;border:1px solid #aac4cf;background:white;border-radius:7px;padding:10px;color:#176b72}canvas{width:100%;height:220px}#status{font-weight:600}h2{font-size:18px;margin-top:0}@media(max-width:600px){.grid{grid-template-columns:1fr}.value{font-size:23px}}
</style><h1>单板实时位移与加速度</h1><p class="muted">ESP32 板端计算 · USB 实时显示 · 相对位移实验</p><section class="card"><div id="status">等待实板数据…</div><div id="identity" class="muted"></div><p><button id="reset">重新置零并静置校准</button> <label><input type="checkbox" id="zupt">启用静止速度约束（可能误判匀速）</label></p><p class="muted">上电或重新置零后，请保持板子不动约2秒。初始位置、速度设为零，Z 向上，X/Y 随起点航向。默认不启用静止约束，以免抹掉真实匀速运动。位移由加速度积分估计，长时间及转动时会漂移。</p></section>
<section class="card"><h2>相对位移（米）</h2><div class="grid" id="position"></div><canvas id="plotP" width="1000" height="220"></canvas></section>
<section class="card"><h2>去重力线加速度（m/s²，共同坐标）</h2><div class="grid" id="linear_accel"></div><canvas id="plotA" width="1000" height="220"></canvas></section>
<section class="card"><h2>原始加速度（m/s²，传感器坐标，含重力）</h2><div class="grid" id="raw_accel"></div><p id="velocity" class="muted"></p></section>
<script>
const $=id=>document.getElementById(id),history=[];let last=null,pending=false;
function values(id,v,valid){$(id).replaceChildren();v.forEach((x,k)=>{const el=document.createElement('div');el.innerHTML='<span class="muted">'+['X','Y','Z'][k]+'</span><div class="value">'+(valid?x.toFixed(4):'—')+'</div>';$(id).append(el);});}
function plot(id,key){const ctx=$(id).getContext('2d');ctx.clearRect(0,0,1000,220);if(history.length<2)return;const all=history.flatMap(r=>r[key]),lo=Math.min(0,...all),hi=Math.max(0,...all),pad=Math.max(.01,(hi-lo)*.1),min=lo-pad,max=hi+pad;ctx.font='12px system-ui';ctx.fillStyle='#637989';ctx.fillText(max.toFixed(3),5,20);ctx.fillText(min.toFixed(3),5,200);for(let k=0;k<3;k++){ctx.strokeStyle=['#b54d00','#0072b2','#007b63'][k];ctx.setLineDash([[6,3],[2,3],[]][k]);ctx.beginPath();history.forEach((r,i)=>{const x=65+i/(history.length-1)*915,y=195-(r[key][k]-min)/(max-min)*170;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}ctx.setLineDash([]);ctx.fillText('最近 '+(history.length/25).toFixed(1)+' 秒 · X 橙 / Y 蓝 / Z 绿',65,218);}
async function command(path){const r=await fetch(path,{method:'POST'});if(!r.ok)throw Error('指令未成功：'+r.status);}
$('reset').onclick=async()=>{try{await command('/reset');await command($('zupt').checked?'/zupt-on':'/zupt-off');history.length=0;}catch(e){$('status').textContent=e.message;}};
$('zupt').onchange=async()=>{try{await command($('zupt').checked?'/zupt-on':'/zupt-off');}catch(e){$('status').textContent=e.message;}};
setInterval(async()=>{if(pending)return;pending=true;try{const r=await fetch('/api');if(!r.ok)throw Error('服务不可用');const s=await r.json(),valid=s.valid&&s.ready;$('status').textContent=(s.valid?s.message:'数据已停止／等待板卡')+(s.holding?' · 静止约束中':'');$('identity').textContent=`${s.device||'等待设备身份'} · ${s.firmware||''} · 已收 ${s.frames} 帧 · ${s.valid?'数据新鲜':'过期'}`;for(const id of ['position','linear_accel','raw_accel'])values(id,s[id]||[0,0,0],id==='raw_accel'?s.valid:valid);$('velocity').textContent='速度 m/s：'+(valid?s.velocity.map(v=>v.toFixed(4)).join(' / '):'—');const key=s.boot+':'+s.sequence;if(s.valid&&key!==last){if(!s.ready)history.length=0;else{history.push(s);if(history.length>750)history.shift();}last=key;}plot('plotP','position');plot('plotA','linear_accel');}catch(e){$('status').textContent='连接中断：'+e.message;for(const id of ['position','linear_accel','raw_accel'])values(id,[0,0,0],false);}finally{pending=false;}},40);
</script></html>
